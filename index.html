<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Otero</title>
<meta name="theme-color" content="#1d3b2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Otero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map" aria-label="Mapa"></div>

<header id="topbar">
  <div id="netchip" class="chip"></div>
  <div id="zonechip" class="chip hidden"></div>
</header>

<div id="mapbtns">
  <button class="fab" id="btn-layers" aria-label="Capas del mapa"><svg viewBox="0 0 24 24"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Zm-7.6 9.3L2 13.6 12 19l10-5.4-2.4-1.3L12 16.4l-7.6-4.1Z"/></svg></button>
  <button class="fab" id="btn-compass" aria-label="Apuntar a los picos"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm3.5 4.5-5 2-2 5 5-2 2-5Zm-3.5 2.4a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Z"/></svg></button>
  <button class="fab" id="btn-locate" aria-label="Centrar en mi posición"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg></button>
</div>

<div id="mainactions">
  <button class="bigbtn" id="btn-where"><span class="ico">📍</span>¿Dónde estoy?</button>
  <button class="bigbtn alt" id="btn-what"><span class="ico">🔍</span>¿Qué es esto?</button>
</div>

<section id="sheet" class="sheet hidden" aria-live="polite">
  <div class="sheet-grip"></div>
  <button class="sheet-close" aria-label="Cerrar">✕</button>
  <div class="sheet-body"></div>
</section>

<section id="view" class="view hidden">
  <div class="view-head"><button class="back" aria-label="Volver">‹</button><h1></h1><div class="view-tools"></div></div>
  <div class="view-body"></div>
</section>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-body"></div></div></div>
<div id="toast" class="toast hidden"></div>

<nav id="tabbar">
  <button data-tab="map" class="on"><span>🗺️</span>Mapa</button>
  <button data-tab="panels"><span>🏔️</span>Paneles</button>
  <button data-tab="library"><span>📖</span>Saber</button>
  <button data-tab="diary"><span>📓</span>Diario</button>
  <button data-tab="more"><span>⋯</span>Más</button>
</nav>

<script src="lib/leaflet.js"></script>
<script src="lib/exifr.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
