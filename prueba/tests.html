<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas de Otero</title>
<style>
  body { font: 15px/1.45 -apple-system, system-ui, sans-serif; margin: 16px; background: #f6f5f0; color: #1d2b25; }
  h1 { font-size: 20px; } li { margin: 3px 0; } .ok { color: #1f7a3a; } .ko { color: #b3261e; font-weight: 600; }
  #sum { font-weight: 700; font-size: 17px; }
</style>
</head>
<body>
<h1>Pruebas automáticas de Otero</h1>
<p>No tocan tus datos: la red y el GPS se simulan. Abre esta página y espera al resumen.</p>
<p id="sum">Ejecutando…</p>
<ol id="out"></ol>
<script type="module">
import { distance, bearing } from './js/geo.js';
import { locate, quality, fmtAcc, LocationError } from './js/location.js';
import { getJSON, overpass, peaksAround, parseWikidataPeaks, parsePhoton, parseOpenMeteoGeo, SourceError, explainError, _setOsmBudget } from './js/sources.js';
import { inSpain, inFrance, baseFor, covers } from './js/layers.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
const results = [];
function assert(c, msg) { if (!c) throw new Error(msg || 'falla la comprobación'); }
async function test(name, fn) {
  const li = document.createElement('li');
  try { await fn(); pass++; li.className = 'ok'; li.textContent = '✓ ' + name; results.push([name, true]); }
  catch (e) { fail++; li.className = 'ko'; li.textContent = '✗ ' + name + ' — ' + e.message; results.push([name, false, e.message]); }
  out.append(li);
}

// ---- utilidades de simulación ----
const realFetch = window.fetch;
const json = (d, status = 200) => Promise.resolve(new Response(JSON.stringify(d), { status, headers: { 'Content-Type': 'application/json' } }));
const hang = signal => new Promise((_, rej) => signal?.addEventListener('abort', () => rej(new DOMException('aborted', 'AbortError'))));
async function withFetch(impl, fn) { window.fetch = impl; try { return await fn(); } finally { window.fetch = realFetch; } }
function fakeGeo(script) {
  // script: lista de [ms, {acc, lat, lon} | {error: code}]
  const timers = [];
  return {
    watchPosition(ok, err) { for (const [ms, ev] of script) timers.push(setTimeout(() => ev.error ? err({ code: ev.error }) : ok({ coords: { latitude: ev.lat ?? 42.6, longitude: ev.lon ?? 0.5, accuracy: ev.acc, altitude: null, altitudeAccuracy: null }, timestamp: Date.now() }), ms)); return 1; },
    clearWatch() { timers.forEach(clearTimeout); },
  };
}

// ---- Geometría ----
await test('distancia Madrid–Barcelona ≈ 505 km', () => { const d = distance(40.4168, -3.7038, 41.3874, 2.1686) / 1000; assert(Math.abs(d - 505) < 6, d.toFixed(1)); });
await test('rumbo norte = 0° y este ≈ 90°', () => { assert(Math.round(bearing(40, 0, 41, 0)) === 0); assert(Math.abs(bearing(0, 0, 0, 1) - 90) < 0.01); });

// ---- Ubicación ----
await test('calidad de la precisión', () => { assert(quality(10) === 'precisa'); assert(quality(200) === 'aceptable'); assert(quality(15000) === 'aproximada'); assert(fmtAcc(15000) === '±15 km'); });
await test('GPS: espera y se queda con la lectura precisa, no con la primera aproximada', async () => {
  const me = await locate({ geo: fakeGeo([[10, { acc: 15000, lat: 42.7 }], [60, { acc: 20, lat: 42.6 }]]), maxWait: 2000 });
  assert(me.acc === 20 && me.lat === 42.6, `acc ${me.acc}`);
});
await test('GPS: si solo hay posición aproximada, la devuelve marcada como aproximada', async () => {
  const me = await locate({ geo: fakeGeo([[10, { acc: 9000 }]]), maxWait: 200 });
  assert(quality(me.acc) === 'aproximada');
});
await test('GPS: permiso denegado da un mensaje con instrucciones', async () => {
  try { await locate({ geo: fakeGeo([[10, { error: 1 }]]), maxWait: 500 }); throw new Error('no falló'); }
  catch (e) { assert(e instanceof LocationError && e.code === 1, e.message); assert(/Ubicación exacta/.test(e.message)); }
});
await test('GPS: sin respuesta, error de tiempo agotado (no se queda esperando)', async () => {
  try { await locate({ geo: fakeGeo([]), maxWait: 150 }); throw new Error('no falló'); }
  catch (e) { assert(e.code === 3, e.message); }
});

// ---- Red ----
await test('getJSON: servidor colgado → error «tiempo agotado»', async () => {
  await withFetch((u, o) => hang(o.signal), async () => {
    try { await getJSON('https://x.test/', {}, 80); throw new Error('no falló'); } catch (e) { assert(e.kind === 'timeout', e.kind); }
  });
});
await test('getJSON: fallo de red → error «network»', async () => {
  await withFetch(() => Promise.reject(new TypeError('Load failed')), async () => {
    try { await getJSON('https://x.test/'); throw new Error('no falló'); } catch (e) { assert(e.kind === 'network', e.kind); }
  });
});
await test('getJSON: 429 → «servidor saturado»', async () => {
  await withFetch(() => json({}, 429), async () => {
    try { await getJSON('https://x.test/'); throw new Error('no falló'); } catch (e) { assert(e.kind === 'busy' && /saturado/.test(explainError(e))); }
  });
});
await test('Overpass: si el primer servidor no contesta, usa el siguiente', async () => {
  await withFetch((u, o) => u.includes('a.test') ? hang(o.signal) : json({ elements: [{ type: 'node', lat: 1, lon: 1, tags: { name: 'X' } }] }), async () => {
    const d = await overpass('q', 2000, { stagger: 50, endpoints: ['https://a.test/', 'https://b.test/'] });
    assert(d.elements.length === 1);
  });
});
await test('Overpass: si el primero falla rápido, no espera para probar el siguiente', async () => {
  const t0 = performance.now();
  await withFetch(u => u.includes('a.test') ? json({}, 504) : json({ elements: [] }), async () => {
    await overpass('q', 2000, { stagger: 5000, endpoints: ['https://a.test/', 'https://b.test/'] });
  });
  assert(performance.now() - t0 < 1000, 'tardó ' + Math.round(performance.now() - t0) + ' ms');
});
await test('Overpass: aviso de error dentro de un 200 cuenta como fallo', async () => {
  await withFetch(() => json({ remark: 'runtime error: Query timed out', elements: [] }), async () => {
    try { await overpass('q', 500, { stagger: 10, endpoints: ['https://a.test/'] }); throw new Error('no falló'); } catch (e) { assert(e.kind === 'busy', e.kind); }
  });
});

// ---- Picos ----
const wd = { results: { bindings: [
  { itemLabel: { value: 'Aneto' }, coord: { value: 'Point(0.6567 42.6311)' }, ele: { value: '3404' } },
  { itemLabel: { value: 'Q123456' }, coord: { value: 'Point(0.6 42.6)' }, ele: { value: '2000' } },
] } };
await test('Picos: sin OpenStreetMap, usa Wikidata (y descarta entradas sin nombre)', async () => {
  await withFetch(u => u.includes('wikidata') ? json(wd) : json({}, 504), async () => {
    const r = await peaksAround(42.6, 0.6, 50000);
    assert(r.source === 'Wikidata' && r.peaks.length === 1 && r.peaks[0].name === 'Aneto', JSON.stringify(r).slice(0, 120));
  });
});
await test('Picos: si OpenStreetMap se cuelga, pasa a Wikidata sin esperar indefinidamente', async () => {
  _setOsmBudget(200);
  try {
    await withFetch((u, o) => u.includes('wikidata') ? json(wd) : hang(o.signal), async () => {
      const t0 = performance.now();
      const r = await peaksAround(42.6, 0.6, 50000);
      assert(r.source === 'Wikidata' && performance.now() - t0 < 2000, `${r.source} en ${Math.round(performance.now() - t0)} ms`);
    });
  } finally { _setOsmBudget(15000); }
});
await test('Picos: si todo se cuelga, termina con error «tiempo agotado»', async () => {
  _setOsmBudget(100);
  try {
    await withFetch((u, o) => u.includes('wikidata') ? json({}, 504) : hang(o.signal), async () => {
      try { await peaksAround(42.6, 0.6, 50000); throw new Error('no falló'); } catch (e) { assert(e.kind === 'timeout', e.kind + ' ' + e.message); }
    });
  } finally { _setOsmBudget(15000); }
});
await test('Picos: si ninguna fuente responde, es un ERROR (no «no hay picos»)', async () => {
  await withFetch(() => json({}, 504), async () => {
    try { await peaksAround(42.6, 0.6, 50000); throw new Error('devolvió lista vacía'); } catch (e) { assert(e instanceof SourceError, e.message); }
  });
});
await test('Picos: respuesta vacía de OpenStreetMap = «no hay picos» (sin error)', async () => {
  await withFetch(() => json({ elements: [] }), async () => {
    const r = await peaksAround(42.6, 0.6, 50000);
    assert(r.source === 'OpenStreetMap' && r.peaks.length === 0);
  });
});
await test('Picos: solo se aceptan picos con altitud numérica', async () => {
  await withFetch(() => json({ elements: [{ type: 'node', lat: 1, lon: 1, tags: { name: 'A', ele: '1200' } }, { type: 'node', lat: 1, lon: 1, tags: { name: 'B', ele: 'unos mil' } }] }), async () => {
    const r = await peaksAround(1, 1, 50000);
    assert(r.peaks.length === 1 && r.peaks[0].ele === 1200);
  });
});

// ---- Buscador ----
await test('Buscador: interpreta Photon y Open-Meteo', () => {
  const p = parsePhoton({ features: [{ geometry: { coordinates: [3.66, 57.11] }, properties: { name: 'Cairn Gorm', osm_value: 'peak', state: 'Scotland', country: 'United Kingdom', countrycode: 'GB' } }] });
  assert(p[0].lat === 57.11 && p[0].kind === 'pico' && /Scotland/.test(p[0].where));
  const o = parseOpenMeteoGeo({ results: [{ name: 'Jaca', latitude: 42.57, longitude: -0.55, feature_code: 'PPL', admin1: 'Aragón', country: 'España', country_code: 'ES' }] });
  assert(o[0].kind === 'población' && o[0].cc === 'ES');
  assert(parsePhoton({}).length === 0 && parseOpenMeteoGeo(null).length === 0);
});

// ---- Cobertura de capas ----
await test('Países: España, Francia, Portugal y resto', () => {
  const cases = [[40.42, -3.70, 'sat'], [42.63, 0.65, 'sat'], [43.26, -2.93, 'sat'], [43.48, -8.23, 'sat'], [38.88, -6.97, 'sat'], [43.60, 1.44, 'satfr'], [45.76, 4.84, 'satfr'], [41.15, -8.61, 'otm'], [46.5, 11.35, 'otm'], [57.1, -3.67, 'otm']];
  for (const [la, lo, k] of cases) assert(baseFor(la, lo) === k, `${la},${lo} → ${baseFor(la, lo)} (esperaba ${k})`);
  assert(!covers('geo', 46.5, 11.35) && covers('otm', 46.5, 11.35));
});

// ---- Publicación: todos los archivos que guarda el modo sin conexión existen ----
await test('Modo sin conexión: todos los archivos de la lista del service worker existen', async () => {
  const sw = await (await realFetch('sw.js', { cache: 'no-store' })).text();
  const list = [...sw.matchAll(/'(\.\/[^']*)'/g)].map(m => m[1]);
  assert(list.length > 30, 'lista corta: ' + list.length);
  const bad = [];
  for (const f of list) { const r = await realFetch(f, { cache: 'no-store' }); if (!r.ok) bad.push(f + ' ' + r.status); }
  assert(!bad.length, bad.join(', '));
  const js = ['app', 'state', 'geo', 'db', 'sources', 'layers', 'zones', 'ui', 'point', 'panels', 'compass', 'library', 'diary', 'identify', 'settings', 'climate', 'location', 'places', 'updates'];
  const missing = js.filter(n => !list.includes(`./js/${n}.js`));
  assert(!missing.length, 'faltan en la lista: ' + missing.join(', '));
  assert(/const VERSION = '\d{4}\.\d{2}\.\d{2}-\d+'/.test(sw), 'VERSION con formato fecha-número');
});

document.getElementById('sum').innerHTML = fail ? `<span class="ko">${fail} prueba(s) fallan</span> · ${pass} correctas` : `<span class="ok">Todas correctas (${pass})</span>`;
window.__results = { pass, fail, results };
</script>
</body>
</html>
